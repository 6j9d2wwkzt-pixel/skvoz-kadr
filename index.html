<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Сквозь Кадр — Merge</title>
<style>
:root{--bg:#050609;--panel:rgba(16,18,25,.82);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
body{display:flex;justify-content:center}
#wrap{position:relative;width:min(100vw,56.25vh);height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 22%,rgba(92,70,180,.16),transparent 30%),#050609}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;opacity:.82}
.stats{display:flex;gap:8px}.pill{min-width:68px;padding:7px 9px;border:1px solid var(--line);background:var(--panel);border-radius:14px;text-align:center;backdrop-filter:blur(10px)}
.pill b{display:block;font-size:16px}.pill span{font-size:9px;opacity:.55;text-transform:uppercase;letter-spacing:.08em}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:92px;font-size:10px;opacity:.42;white-space:nowrap;transition:opacity .5s}
#next{position:absolute;top:124px;left:50%;transform:translateX(-50%);text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
#nextBall{margin:6px auto 0;width:22px;height:22px;border-radius:50%;box-shadow:0 0 18px rgba(255,255,255,.25)}
#gameOver{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);pointer-events:auto}
.card{width:78%;padding:28px 22px;border:1px solid var(--line);background:rgba(12,14,20,.92);border-radius:24px;text-align:center;box-shadow:0 20px 60px #000}
.card h1{margin:0 0 8px;font-size:30px}.card p{margin:5px 0 20px;opacity:.6}
button{border:0;border-radius:16px;padding:13px 24px;background:#fff;color:#050609;font-weight:800;font-size:15px}
#pause{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;background:rgba(20,22,29,.72);color:#fff;border:1px solid var(--line);padding:9px 17px;font-size:12px;backdrop-filter:blur(8px)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ui">
<div class="top"><div class="brand">СКВОЗЬ КАДР</div><div class="stats">
<div class="pill"><b id="score">0</b><span>счёт</span></div><div class="pill"><b id="best">0</b><span>рекорд</span></div>
</div></div>
<div id="hint">НАЖМИ, ЧТОБЫ СБРОСИТЬ ШАР</div>
<div id="next">следующий<div id="nextBall"></div></div>
<button id="pause">ПАУЗА</button>
</div>
<div id="gameOver"><div class="card"><h1>КОНЕЦ</h1><p>Счёт: <b id="finalScore">0</b></p><button id="restart">ИГРАТЬ СНОВА</button></div></div>
<div id="flash"></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),nextBallEl=document.getElementById('nextBall');
const hint=document.getElementById('hint'),gameOverEl=document.getElementById('gameOver'),finalScore=document.getElementById('finalScore');
const pauseBtn=document.getElementById('pause'),restartBtn=document.getElementById('restart'),flash=document.getElementById('flash');
let W,H,DPR,balls=[],particles=[],score=0,best=+localStorage.skvozBest||0,paused=false,over=false,last=0,dropCooldown=0,combo=0,comboTimer=0,current=0,next=0,dropX=.5;
const colors=['#d7d7df','#c6a5ff','#76d7ff','#70f0b0','#ffe27a','#ffad70','#ff729d','#c78cff','#ffffff'];
const sizes=[15,20,26,33,41,51,63,77,94];
function resize(){W=wrap.clientWidth;H=wrap.clientHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function wall(){return{cx:W/2,cy:H*.60,R:Math.min(W*.43,H*.37)}} function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function randLevel(){return Math.random()<.72?Math.floor(Math.random()*3):Math.floor(Math.random()*4)}
function makeBall(x,y,l,vy=0){return{x,y,l,r:sizes[l],vx:(Math.random()-.5)*18,vy,rot:Math.random()*6.28}}
function newRound(){balls=[];particles=[];score=0;combo=0;comboTimer=0;over=false;paused=false;current=randLevel();next=randLevel();dropX=.5;gameOverEl.style.display='none';pauseBtn.textContent='ПАУЗА';updateUI()}
function updateUI(){scoreEl.textContent=score;bestEl.textContent=best;nextBallEl.style.background=colors[next];nextBallEl.style.boxShadow='0 0 18px '+colors[next]+'88'}
function drop(){if(paused||over||dropCooldown>0)return;const w=wall(),x=clamp(dropX*W,w.cx-w.R+sizes[current]+3,w.cx+w.R-sizes[current]-3);balls.push(makeBall(x,H*.185,current,20));current=next;next=randLevel();dropCooldown=.25;comboTimer=0;updateUI();hint.style.opacity=.08}
function burst(x,y,col,big=false){const n=big?30:12;for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(big?80:45)+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*3,life:1,col})}flash.style.opacity=big?.08:.025;setTimeout(()=>flash.style.opacity=0,45)}
function merge(a,b){if(a.l!==b.l)return false;if(a.dead||b.dead)return true;const l=a.l+1;if(l>=sizes.length)return false;const x=(a.x+b.x)/2,y=(a.y+b.y)/2;a.dead=b.dead=true;balls.push(makeBall(x,y,l,-90));score+=(l+1)*10*(combo>2?2:1);combo++;comboTimer=1.2;burst(x,y,colors[l],l>=5);best=Math.max(best,score);localStorage.skvozBest=best;updateUI();return true}
function physics(dt){const w=wall(),g=1050;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
for(const b of balls){if(b.dead)continue;b.vy+=g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt*.008;const dx=b.x-w.cx,dy=b.y-w.cy,d=Math.hypot(dx,dy)||1,inner=w.R-b.r-2;if(d>inner){const nx=dx/d,ny=dy/d;b.x=w.cx+nx*inner;b.y=w.cy+ny*inner;const vn=b.vx*nx+b.vy*ny;if(vn>0){b.vx-=vn*nx*1.55;b.vy-=vn*ny*1.55;b.vx*=.97;b.vy*=.82}b.vx+=-ny*18*dt;b.vy+=nx*18*dt}}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.dead||b.dead)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d<min){if(a.l===b.l&&d<min*.96){merge(a,b);continue}const nx=dx/d,ny=dy/d,ov=min-d;a.x-=nx*ov*.5;a.y-=ny*ov*.5;b.x+=nx*ov*.5;b.y+=ny*ov*.5;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rv=rvx*nx+rvy*ny;if(rv<0){const imp=-rv*.72;a.vx-=nx*imp;b.vx+=nx*imp;a.vy-=ny*imp;b.vy+=ny*imp}}}
balls=balls.filter(b=>!b.dead);if(comboTimer>0)comboTimer-=dt;else combo=0;dropCooldown=Math.max(0,dropCooldown-dt);
if(balls.some(b=>b.y-b.r<H*.16&&Math.abs(b.vy)<20&&b.y>H*.13))endGame()}
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return'rgb('+(r*f|0)+','+(g*f|0)+','+(b*f|0)+')'}
function drawBall(b){const col=colors[b.l],grad=ctx.createRadialGradient(b.x-b.r*.32,b.y-b.r*.38,b.r*.1,b.x,b.y,b.r);grad.addColorStop(0,'#fff');grad.addColorStop(.18,col);grad.addColorStop(1,shade(col,.52));ctx.save();ctx.shadowColor=col;ctx.shadowBlur=10+b.l*2;ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.35,b.r*.18,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const w=wall(),bg=ctx.createRadialGradient(w.cx,w.cy,w.R*.2,w.cx,w.cy,w.R*1.3);bg.addColorStop(0,'rgba(45,40,75,.16)');bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.save();ctx.shadowColor='rgba(130,110,255,.22)';ctx.shadowBlur=28;ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(w.cx,w.cy,w.R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(w.cx,w.cy,w.R+7,0,Math.PI*2);ctx.stroke();ctx.restore();
ctx.fillStyle='#050609';ctx.fillRect(w.cx-42,w.cy-w.R-8,84,18);
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
balls.slice().sort((a,b)=>a.r-b.r).forEach(drawBall);
if(!paused&&!over){const x=clamp(dropX*W,w.cx-w.R+sizes[current]+3,w.cx+w.R-sizes[current]-3);ctx.globalAlpha=.25;ctx.strokeStyle=colors[current];ctx.lineWidth=1;ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(x,H*.21);ctx.lineTo(x,H*.31);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.7;ctx.fillStyle=colors[current];ctx.beginPath();ctx.arc(x,H*.185,sizes[current],0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
if(paused){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='800 24px system-ui';ctx.textAlign='center';ctx.fillText('ПАУЗА',W/2,H/2)}}
function endGame(){if(over)return;over=true;finalScore.textContent=score;gameOverEl.style.display='flex'}
function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;if(!paused&&!over)physics(dt);draw();requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();dropX=clamp((e.clientX-r.left)/r.width,.08,.92);drop()});
canvas.addEventListener('pointermove',e=>{if(e.pressure>0){const r=canvas.getBoundingClientRect();dropX=clamp((e.clientX-r.left)/r.width,.08,.92)}});
pauseBtn.onclick=e=>{e.stopPropagation();if(over)return;paused=!paused;pauseBtn.textContent=paused?'ПРОДОЛЖИТЬ':'ПАУЗА'};
restartBtn.onclick=e=>{e.stopPropagation();newRound()};newRound();requestAnimationFrame(loop);
</script>
</body></html>
